# Profil (sources : voir sourcesProfil)
biographie: "Originaire de l'Ardèche, diplômée de Sciences Po Grenoble et docteure en science politique (2016), elle a travaillé pour des ONG humanitaires avant de rejoindre l'université de Groningue, aux Pays-Bas, en 2018. Engagée en faveur du référendum d'initiative citoyenne, elle a été en 2022 la candidate du collectif Espoir RIC, devenu le parti Solution démocratique, sans obtenir les 500 parrainages requis. Son programme pour 2027 prévoit qu'une révision de la Constitution réclamée par 700 000 signataires puisse être soumise à référendum."
