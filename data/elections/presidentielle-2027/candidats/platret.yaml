# Profil (sources : voir sourcesProfil ; pas d'article sur Wikipédia en français au 15 octobre 2026)
naissance: { date: 1973-04-19, lieu: "Saint-Rémy (Saône-et-Loire)" }
biographie: "Diplômé de Sciences Po Paris et titulaire d'un DEA d'histoire contemporaine, il est journaliste au Journal de Saône-et-Loire puis se consacre à des publications sur l'histoire de la Bourgogne. Élu local à Saint-Désert dès 1995, il conduit la droite à Chalon-sur-Saône, dont il devient maire en 2014. Porte-parole puis vice-président de LR (2019-2023), tête de liste de la droite aux régionales de 2021, il quitte le parti en 2024."
fonctions:
  - { intitule: "Maire de Chalon-sur-Saône", periode: "depuis mars 2014" }
  - { intitule: "Président délégué du Grand Chalon (sécurité et prévention de la délinquance, attractivité touristique)", periode: "depuis avril 2026" }
  - { intitule: "Conseiller régional de Bourgogne-Franche-Comté (non-inscrit depuis septembre 2025)", periode: "depuis janvier 2016" }
