# Profil (sources : voir sourcesProfil)
naissance: { date: 1976-04-28, lieu: "Strasbourg (Bas-Rhin)" }
biographie: "Diplômé de Sciences Po Strasbourg et de l'ENA (promotion Léopold-Sédar-Senghor, celle d'Emmanuel Macron), magistrat administratif et enseignant à l'université de Haute-Alsace. Membre du PS de 1997 à 2005, il devient en 2008 maire de Rixheim, puis député en 2017. Cofondateur d'Agir, il préside le groupe Agir ensemble (2020-2022) avant d'être ministre délégué au Commerce extérieur dans le gouvernement Borne."
fonctions:
  - { intitule: "Député de la 5e circonscription du Haut-Rhin (apparenté Ensemble pour la République)", periode: "depuis février 2024 (déjà député de 2017 à 2022)" }
  - { intitule: "Conseiller municipal de Rixheim", periode: "depuis septembre 2017" }
