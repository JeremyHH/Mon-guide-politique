# Profil : pas d'article Wikipédia ; sources = presse régionale et nationale, site du mouvement
biographie: "Adhérent du Parti socialiste à 15 ans, il a ensuite fait un stage à La France insoumise et milité sous l'étiquette du Nouveau Front populaire en Seine-Saint-Denis, avant de quitter les partis en se disant déçu par la politique traditionnelle. Il a mis en pause ses études d'histoire pour se consacrer à sa candidature, accompagné de son ami d'enfance et porte-parole Gaspard Geniteau. Son programme prévoit de réunir un collège de constitutionnalistes, puis une assemblée constituante formée d'un échantillon représentatif de Français tirés au sort ; la nouvelle Constitution serait soumise à référendum. Pendant cette période, de nouvelles législatives seraient organisées et le gouvernement serait issu du parti arrivé en tête. Fils du réalisateur Mathias Mlekuz, il a fait des apparitions dans des séries télévisées. Il finance sa campagne avec environ 12 000 euros issus d'un héritage et d'un emploi de serveur."
