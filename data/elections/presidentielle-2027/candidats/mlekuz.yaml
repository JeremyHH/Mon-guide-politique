bio: "Étudiant en histoire de 20 ans, originaire de Montreuil (Seine-Saint-Denis), fondateur du mouvement Trajectoire. Il parcourt la France en camion aménagé pour réunir les 500 parrainages, avec un projet central : une assemblée constituante tirée au sort chargée de rédiger une nouvelle Constitution."
