# Profil (sources : voir sourcesProfil)
naissance: { date: 1968-08-05, lieu: "Neuilly-sur-Seine (Hauts-de-Seine)" }
biographie: "Diplômée en droit de l'université Panthéon-Assas, avocate avant de se consacrer à la politique. Fille de Jean-Marie Le Pen, fondateur du Front national, elle adhère au parti en 1986 et le préside de 2011 à 2021 ; il prend le nom de Rassemblement national en 2018."
fonctions:
  - { intitule: "Présidente du groupe Rassemblement national à l'Assemblée nationale", periode: "depuis juin 2022" }
  - { intitule: "Députée du Pas-de-Calais (11e circonscription)", periode: "depuis juin 2017" }
  - { intitule: "Présidente du Front national puis du Rassemblement national", periode: "janvier 2011 – septembre 2021" }
  - { intitule: "Députée européenne", periode: "2004 – 2017" }
  - { intitule: "Conseillère régionale (Île-de-France, puis Nord-Pas-de-Calais / Hauts-de-France)", periode: "1998 – 2021, avec interruptions" }
  - { intitule: "Conseillère départementale du Pas-de-Calais", periode: "2021 – 2025" }
