bio: "Président de la région Hauts-de-France depuis 2016, ancien ministre de la Santé puis du Travail. A affirmé le 27 août 2026 qu'il serait candidat, sans se déclarer officiellement ; dit vouloir se présenter en candidat indépendant et refuse une primaire de la droite et du centre."
