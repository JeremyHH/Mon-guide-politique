# Profil (sources : voir sourcesProfil)
naissance: { date: 1965-03-21, lieu: "Châlons-sur-Marne (Marne)" }
biographie: "Agent général d'assurance avant d'entrer en politique, il est député de l'Aisne à partir de 2002, puis ministre de la Santé (2005-2007) et ministre du Travail sous Nicolas Sarkozy (2007-2009 et 2010-2012), et secrétaire général de l'UMP de 2009 à 2010. Président des Hauts-de-France depuis 2016, il quitte LR en 2017, y revient en 2021 pour le congrès désignant le candidat à la présidentielle de 2022, puis fonde le mouvement Nous France, associé à LR, en 2022."
fonctions:
  - { intitule: "Président du conseil régional des Hauts-de-France", periode: "depuis janvier 2016" }
  - { intitule: "Fondateur du mouvement Nous France", periode: "depuis 2022" }
  - { intitule: "Ministre du Travail, de l'Emploi et de la Santé", periode: "novembre 2010 – mai 2012" }
  - { intitule: "Secrétaire général de l'UMP", periode: "janvier 2009 – novembre 2010" }
  - { intitule: "Ministre du Travail, des Relations sociales et de la Solidarité", periode: "mai 2007 – janvier 2009" }
  - { intitule: "Ministre de la Santé et des Solidarités", periode: "juin 2005 – mars 2007" }
  - { intitule: "Secrétaire d'État chargé de l'Assurance maladie", periode: "mars 2004 – juin 2005" }
  - { intitule: "Maire de Saint-Quentin", periode: "2010 – 2016" }
  - { intitule: "Député de l'Aisne (2e circonscription)", periode: "2002 – 2016 (hors périodes au gouvernement)" }
