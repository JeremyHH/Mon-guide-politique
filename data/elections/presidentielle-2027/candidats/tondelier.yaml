# Site officiel (vérifié le 4 octobre 2026)
site: { url: "https://marinetondelier.fr/", type: campagne }
positions:
  retraites:
    texte: "Abroger la réforme de 2023 pour revenir à 62 ans ; objectif de 60 ans en priorité pour les carrières longues et les métiers pénibles, financé en partie par une réduction des exonérations de cotisations."
    statut: verifie
    source:
      titre: "franceinfo, « Changement de système, passage à 60 ou à 65 ans, capitalisation... Que proposent les principaux candidats à l'élection présidentielle pour les retraites ? »"
      url: "https://www.franceinfo.fr/economie/retraite/reforme-des-retraites/changement-de-systeme-passage-a-60-ou-a-65-ans-capitalisation-que-proposent-les-principaux-candidats-a-l-election-presidentielle-pour-les-retraites_8215784.html"
      date: 2026-09-30
  immigration:
    texte: "Abroger la loi immigration de janvier 2024 ; refuser les quotas ; développer les voies légales de migration."
    statut: a_verifier
  energie:
    texte: "Système reposant à terme sur les renouvelables, le nucléaire étant jugé trop cher et trop lent ; ne demande plus la fermeture anticipée des centrales existantes."
    statut: verifie
    source:
      titre: "Révolution Énergétique, « Qui dit quoi sur l'énergie parmi les candidats déclarés à la présidentielle ? »"
      url: "https://www.revolution-energetique.com/actus/qui-dit-quoi-sur-lenergie-parmi-les-candidats-declares-a-la-presidentielle/"
      date: 2026-06-27
  fiscalite:
    texte: "Rétablir un ISF dès 1,3 million d'euros avec un volet climatique, soutenir la taxe Zucman, taxer de 10 % les héritages au-delà de 4 millions d'euros."
    statut: verifie
    source:
      titre: "Les Écologistes, dossier de presse « Budget 2027 » (site de Marine Tondelier)"
      url: "https://marinetondelier.fr/s/dossierpresse-budget2027.pdf"
      date: 2026-08-26
  europe:
    texte: "Une Europe fédérale, « écologique, sociale et démocratique », avec un État-providence européen et une justice fiscale européenne."
    statut: verifie
    source:
      titre: "Site de Marine Tondelier, journal de campagne, « Épisode 27 - Une autre Europe est possible »"
      url: "https://marinetondelier.fr/journal-de-campagne/une-autre-europe-est-possible"
      date: 2026-09-16
  securite: null
