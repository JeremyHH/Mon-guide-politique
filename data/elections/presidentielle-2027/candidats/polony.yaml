# Profil (sources : voir sourcesProfil)
naissance: { date: 1975-04-15, lieu: "Paris" }
biographie: "Agrégée de lettres modernes, brièvement professeure stagiaire, puis diplômée de Sciences Po, elle milite au Mouvement des citoyens de Jean-Pierre Chevènement en 2001-2002. Journaliste à Marianne puis au Figaro, chroniqueuse à la radio et à la télévision (On n'est pas couché, Europe 1, Canal+, Paris Première, BFMTV, France 5), elle dirige la rédaction de Marianne de 2018 à 2024 avant de cofonder la revue L'Audace !. Elle entre en politique fin août 2026."
