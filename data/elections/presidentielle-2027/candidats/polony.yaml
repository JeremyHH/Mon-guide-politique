# Le soutien de République souveraine (8 octobre 2026) ne change rien : ce parti n'a pas non plus d'élus nationaux ou européens.
representation: false
declaration: 2026-10-14
bio: "Journaliste et essayiste, ancienne directrice de la rédaction de Marianne (2018-2024) et directrice de la revue L'Audace !. Se revendique du « gaullisme social » et a lancé en septembre 2026 un mouvement destiné aux « orphelins de la politique », « Nous sommes la France »."
