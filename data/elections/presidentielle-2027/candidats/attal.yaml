prenom: "Gabriel"
nom: "Attal"
parti: "Renaissance"
statut: declare
declaration: 2026-05-22
bio: "Ancien Premier ministre (2024), secrétaire général de Renaissance. Candidat officiel depuis le 22 mai 2026."
positions:
  retraites:
    texte: "Supprimer l'âge légal : seule la durée de cotisation compte, avec décote ou surcote ; ajouter une part de capitalisation (1 000 euros versés par l'État à chaque nouveau-né)."
    statut: verifie
    source:
      titre: "franceinfo, « Changement de système, passage à 60 ou à 65 ans, capitalisation... Que proposent les principaux candidats à l'élection présidentielle pour les retraites ? »"
      url: "https://www.franceinfo.fr/economie/retraite/reforme-des-retraites/changement-de-systeme-passage-a-60-ou-a-65-ans-capitalisation-que-proposent-les-principaux-candidats-a-l-election-presidentielle-pour-les-retraites_8215784.html"
      date: 2026-09-30
  immigration:
    texte: "« Accueillir moins pour accueillir mieux » : privilégier l'immigration de travail avec un système à points comme au Canada, et réduire le regroupement familial."
    statut: verifie
    source:
      titre: "Site de campagne de Gabriel Attal, « Frontières » (page consultée le 4 octobre 2026)"
      url: "https://attalpresident.fr/programme/frontieres"
      date: 2026-10-04
  energie:
    texte: "« Plan Messmer II » : ramener les énergies fossiles sous 30 % de la consommation en 2035, sécuriser la construction de 14 EPR et viser un réacteur par an, accélérer l'électrification."
    statut: verifie
    source:
      titre: "Site de campagne de Gabriel Attal, « Un plan de désendettement et un Messmer II »"
      url: "https://attalpresident.fr/actualites/gabriel-attal-presente-un-plan-de-desendettement-et-un-messmer-ii-pour-sortir-des-dependances-francaises"
      date: 2026-09-23
  fiscalite:
    texte: "150 milliards d'euros d'économies, dont deux tiers sur les dépenses sociales ; déficit sous 3 % avant la fin du mandat, équilibre des finances publiques en 2037 ; règle d'or dans la Constitution."
    statut: verifie
    source:
      titre: "Site de campagne de Gabriel Attal, « Un plan de désendettement et un Messmer II »"
      url: "https://attalpresident.fr/actualites/gabriel-attal-presente-un-plan-de-desendettement-et-un-messmer-ii-pour-sortir-des-dependances-francaises"
      date: 2026-09-23
  europe:
    texte: "Bâtir des « États-Unis d'Europe » : fusion économique, technologique et écologique d'un noyau dur de pays volontaires, avec 12 grands projets communs et une préférence européenne."
    statut: verifie
    source:
      titre: "Site de campagne de Gabriel Attal, « À Reims : bâtir les États-Unis d'Europe pour retrouver notre puissance »"
      url: "https://attalpresident.fr/actualites/gabriel-attal-a-reims-batir-les-etats-unis-d-europe-pour-retrouver-notre-puissance"
      date: 2026-09-17
  securite:
    texte: "Une réforme « en profondeur » du système judiciaire."
    statut: verifie
    source:
      titre: "franceinfo, « \"Quotas limitatifs\" pour l'immigration… Gabriel Attal profite-t-il de l'été pour ancrer sa campagne à droite ? »"
      url: "https://www.franceinfo.fr/elections/presidentielle/quotas-limitatifs-pour-l-immigration-presence-dans-les-medias-de-la-sphere-bollore-gabriel-attal-profite-t-il-de-l-ete-pour-ancrer-sa-campagne-presidentielle-a-droite_8137157.html"
