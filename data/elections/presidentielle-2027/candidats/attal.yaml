      date: 2026-09-30
  immigration:
    texte: "« Accueillir moins pour accueillir mieux » : privilégier l'immigration de travail avec un système à points comme au Canada, et réduire le regroupement familial."
    statut: verifie
    source:
      titre: "Site de campagne de Gabriel Attal, « Frontières » (page consultée le 4 octobre 2026)"
      url: "https://attalpresident.fr/programme/frontieres"
      date: 2026-10-04
  energie:
    texte: "« Plan Messmer II » : ramener les énergies fossiles sous 30 % de la consommation en 2035, sécuriser la construction de 14 EPR et viser un réacteur par an, accélérer l'électrification."
    statut: verifie
    source:
      titre: "Site de campagne de Gabriel Attal, « Un plan de désendettement et un Messmer II »"
      url: "https://attalpresident.fr/actualites/gabriel-attal-presente-un-plan-de-desendettement-et-un-messmer-ii-pour-sortir-des-dependances-francaises"
      date: 2026-09-23
  fiscalite:
    texte: "150 milliards d'euros d'économies, dont deux tiers sur les dépenses sociales ; déficit sous 3 % avant la fin du mandat, équilibre des finances publiques en 2037 ; règle d'or dans la Constitution."
    statut: verifie
    source:
      titre: "Site de campagne de Gabriel Attal, « Un plan de désendettement et un Messmer II »"
      url: "https://attalpresident.fr/actualites/gabriel-attal-presente-un-plan-de-desendettement-et-un-messmer-ii-pour-sortir-des-dependances-francaises"
      date: 2026-09-23
