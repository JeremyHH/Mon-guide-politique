# Site officiel (vérifié le 4 octobre 2026)
site: { url: "https://www.edouardphilippe.fr/", type: campagne }
positions:
  retraites:
    texte: "Reprendre la réforme de 2023, puis passer en moins de 10 ans à 65 ans et 45 annuités, avec des départs entre 60 et 64 ans pour les carrières longues et pénibles ; ajouter un volet capitalisation."
    statut: verifie
    source:
      titre: "franceinfo, « Changement de système, passage à 60 ou à 65 ans, capitalisation... Que proposent les principaux candidats à l'élection présidentielle pour les retraites ? »"
      url: "https://www.franceinfo.fr/economie/retraite/reforme-des-retraites/changement-de-systeme-passage-a-60-ou-a-65-ans-capitalisation-que-proposent-les-principaux-candidats-a-l-election-presidentielle-pour-les-retraites_8215784.html"
      date: 2026-09-30
  immigration:
    texte: "Suspendre pour plusieurs années les demandes d'asile à Mayotte et en Guyane, mettre fin à l'accord franco-algérien de 1968, soumettre les régularisations massives à l'accord des pays Schengen."
    statut: verifie
    source:
      titre: "franceinfo, « Après l'afflux de migrants à Ceuta, Edouard Philippe propose des mesures pour limiter l'immigration… »"
      url: "https://www.franceinfo.fr/societe/immigration/apres-l-afflux-de-migrants-a-ceuta-edouard-philippe-propose-des-mesures-pour-limiter-l-immigration-et-les-regularisations-de-sans-papiers-dans-l-union-europeenne_8141837.html"
      date: 2026-08-10
  energie:
    texte: "Relancer le nucléaire, développer les renouvelables et électrifier massivement les usages ; prix du carbone aux frontières européennes."
    statut: verifie
    source:
      titre: "Site de campagne d'Édouard Philippe, « Pour une France plus conquérante » (page consultée le 4 octobre 2026)"
      url: "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-conquerante"
      date: 2026-10-04
  fiscalite:
    texte: "Baisser de 50 milliards d'euros les impôts de production contre 50 milliards d'aides publiques en moins ; règle d'or ; déficit ramené à 2 % du PIB en fin de quinquennat ; aucun nouvel impôt."
    statut: verifie
    source:
      titre: "Site de campagne d'Édouard Philippe, « Pour une France plus prospère » (page consultée le 4 octobre 2026)"
      url: "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere"
      date: 2026-10-04
  europe:
    texte: "Protéger le marché européen face à la concurrence chinoise, achever le marché unique, construire une union des marchés de capitaux."
    statut: verifie
    source:
      titre: "Site de campagne d'Édouard Philippe, « Pour une France plus prospère » (page consultée le 4 octobre 2026)"
      url: "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-prospere"
      date: 2026-10-04
  securite:
    texte: "Peines courtes dès la première infraction, peines planchers pour les infractions les plus graves, suppression du juge d'application des peines, « état d'urgence narco »."
    statut: verifie
    source:
      titre: "Site de campagne d'Édouard Philippe, « Pour une France plus sûre » (page consultée le 4 octobre 2026)"
      url: "https://www.edouardphilippe.fr/priorites/pour-une-france-plus-sure"
      date: 2026-10-04
