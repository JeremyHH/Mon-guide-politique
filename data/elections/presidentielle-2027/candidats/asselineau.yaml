# Profil (sources : voir sourcesProfil)
naissance: { date: 1957-09-14, lieu: "Paris" }
biographie: "Diplômé d'HEC et de l'ENA, inspecteur général des finances. Il occupe plusieurs postes en cabinet ministériel dans les années 1990 et 2000, puis fonde l'UPR en mars 2007."
fonctions:
  - { intitule: "Président de l'Union populaire républicaine", periode: "depuis mars 2007" }
  - { intitule: "Conseiller de Paris", periode: "2001 – 2008" }
resultats:
  - { annee: 2017, scrutin: "Présidentielle", resultat: "0,92 % au premier tour" }
condamnations: []
procedures:
  - "Mis en examen le 5 février 2021 pour harcèlement moral, harcèlement sexuel et agressions sexuelles par personne ayant autorité, ce qu'il conteste. Après un non-lieu prononcé en décembre 2024 et un appel du parquet, la cour d'appel de Paris a ordonné en avril 2026 son renvoi devant un tribunal. Il est présumé innocent."
