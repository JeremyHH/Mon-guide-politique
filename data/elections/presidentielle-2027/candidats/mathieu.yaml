biographie: "Sans expérience politique antérieure, il dit avoir décidé de se lancer après la réélection d'Emmanuel Macron en 2022. Il prévoit un tour de France à vélo d'environ 10 000 km en un an pour rencontrer en priorité des maires sans étiquette. Il défend une démocratie plus directe : référendum d'initiative citoyenne, conventions citoyennes tirées au sort et assemblée citoyenne chargée de réécrire la Constitution."
