naissance: { date: 1958-08-08, lieu: "Bayonne (Pyrénées-Atlantiques)" }
biographie: "Connu depuis 1986 pour la chanson « On se retrouvera », il s'engage d'abord dans l'écologie politique (MEI, Alliance écologiste indépendante), puis rejoint les Gilets jaunes en 2018. Tête de liste France libre avec Dieudonné aux européennes de 2024, il est déclaré inéligible pour 18 mois en 2025 faute d'avoir déposé ses comptes de campagne ; sa liste aux municipales de 2026 à Lyon n'est pas enregistrée."
