condamnations: []
procedures:
  - "Mis en examen pour viol en novembre 2021, puis dans deux autres affaires (agression sexuelle et viol) en juin 2023. Le 6 août 2026, le parquet de Paris a requis son renvoi devant la cour criminelle départementale pour le viol présumé de 2021 et un non-lieu pour les deux autres affaires ; le juge d'instruction doit encore se prononcer. Il conteste les faits. Il est présumé innocent."
  - "Arrêté en août 2023 au Sénégal, où la justice avait émis un mandat d'arrêt international contre lui, il y a été inculpé notamment pour complot et diffusion de fausses nouvelles, puis libéré le 7 août 2023 et rentré en France ; les suites de cette procédure ne sont pas précisées dans les sources consultées. Il est présumé innocent."
