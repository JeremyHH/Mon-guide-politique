# Profil (sources : voir sourcesProfil)
naissance: { date: 1989-08-26, lieu: "Estepona (Andalousie, Espagne)" }
biographie: "Diplômé de l'École normale supérieure (2013) et docteur en droit (2014), il conseille WikiLeaks et Julian Assange avant de devenir avocat en 2017 ; il défend notamment des figures du mouvement des Gilets jaunes. Candidat de La France insoumise aux législatives de 2017 en Seine-Saint-Denis, il publie en 2019 « Crépuscule », critique de l'accession au pouvoir d'Emmanuel Macron. Le barreau de Paris l'a suspendu neuf mois pour avoir publié des éléments couverts par le secret de l'instruction d'une enquête le visant (sanction disciplinaire confirmée en appel en octobre 2025)."
fonctions:
  - { intitule: "Avocat au barreau de Paris", periode: "depuis avril 2017" }
