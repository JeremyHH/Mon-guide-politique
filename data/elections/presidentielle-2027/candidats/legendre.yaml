# Profil : pas d'article Wikipédia ; sources = franceinfo, Le Parisien, site et manifeste du mouvement
biographie: "Né en Normandie, marié et père de quatre enfants, cet ancien chef d'entreprise vit dans les Alpes-de-Haute-Provence. Il n'a été ni ministre ni député. Il porte la candidature du mouvement « À nous maintenant », qui se présente comme une « alternative citoyenne » hors des partis, et explique son engagement par la colère et la défiance de son entourage envers les responsables politiques. Il est l'auteur du manifeste du mouvement, « 64 % – vers une alternative citoyenne en France », construit autour de quatre piliers : restaurer la démocratie (référendums d'initiative citoyenne, rôle central des maires), sortir de la dette par des budgets à l'équilibre, revitaliser les territoires ruraux et protéger l'environnement."
