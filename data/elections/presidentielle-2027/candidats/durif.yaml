# Profil (sources : voir sourcesProfil)
naissance: { date: 1969-08-23, lieu: "Nantua (Ain)" }
biographie: "Originaire de Nantua (Ain), il se fait connaître en décembre 2012 à Bugarach (Aude), village alors très médiatisé à l'approche de la « fin du monde » associée au calendrier maya, où il déclare incarner le « Christ cosmique ». Il diffuse ensuite des vidéos sur les réseaux sociaux, où il évoque notamment les « reptiliens », les extraterrestres ou les « illuminati » ; Wikipédia le présente comme une personnalité de l'internet « connue pour avoir diffusé des vidéos complotistes ». Il a créé en 2004 la société Elvita et se présente comme guérisseur et ancien médium. Il vit au Sénégal depuis 2017. Candidat aux municipales de 2014 à Arques (Aude), il avait annoncé une candidature à la présidentielle de 2017 sans réunir les 500 parrainages."
