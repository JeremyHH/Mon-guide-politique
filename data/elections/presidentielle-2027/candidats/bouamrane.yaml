# Profil (sources : voir sourcesProfil)
naissance: { date: 1973-02-21, lieu: "Clichy (Hauts-de-Seine)" }
biographie: "Ancien cadre commercial dans la sécurité informatique, il est conseiller municipal communiste de Saint-Ouen de 1995 à 2014, puis rejoint le Parti socialiste, dont il devient porte-parole en 2016. Élu maire de Saint-Ouen-sur-Seine en 2020 et réélu en 2026, il lance en octobre 2024 le mouvement social-démocrate La France humaine et forte."
