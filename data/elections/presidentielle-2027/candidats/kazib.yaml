# Profil (sources : voir sourcesProfil)
naissance: { date: 1987-01-02, lieu: "Sarcelles (Val-d'Oise)" }
biographie: "Cheminot depuis 2012, aiguilleur à la gare de triage du Bourget, il y fonde en 2014 une section SUD Rail dont il devient délégué syndical. Figure de la grève des cheminots de 2018, il est alors chroniqueur dans l'émission « Les Grandes Gueules » sur RMC. Membre du courant qui a quitté le NPA en 2021 pour former Révolution permanente, il a tenté une première candidature à la présidentielle de 2022."
