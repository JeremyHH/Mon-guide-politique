# Fiche en attente : non publiée tant que la candidature n'est pas officiellement déclarée
# (collecte lancée le 10 juillet 2026 « pour être à nouveau candidat », décision annoncée pour l'automne).
# Pour la publier : renseigner `declaration`, puis déplacer ce fichier dans ../candidats/.
# Positions avec « statut: verifie » : sourcées. Les autres restent à sourcer.
prenom: "Jean"
nom: "Lassalle"
parti: "Résistons !"
statut: declare
# Pas de représentation : Résistons ! n'a ni député, ni sénateur, ni député européen (liste « L'Alliance rurale » à 2,35 % aux européennes de 2024).
representation: false
# Date retenue : lancement d'une cagnotte pour « être de nouveau candidat » (10 juillet 2026), candidature conditionnée au résultat de la collecte.
# franceinfo le compte parmi les candidats déclarés ; aucune annonce plus formelle trouvée au 15 octobre 2026.
bio: "Président de Résistons !, ancien maire de Lourdios-Ichère (1977-2017) et ancien député des Pyrénées-Atlantiques (2002-2022). Candidat à la présidentielle en 2017 (1,21 %) et en 2022 (3,13 %), il veut porter une candidature « contre le système, mais pour la France »."
# Site officiel (vérifié le 15 octobre 2026)
site: { url: "https://resistons-france.fr/", type: parti }
# Positions : programme publié sur le site de Résistons ! (page datée du 23 mars 2025), qui reprend pour l'essentiel le projet présidentiel de 2022.
positions:
  retraites:
    texte: "Fixer l'âge de la retraite en fonction des annuités de cotisation et garantir dans la Constitution le maintien du pouvoir d'achat des retraités face à l'inflation."
    statut: verifie
    anterieur: "Présidentielle 2022"
    source:
      titre: "Site de Résistons !, page d'accueil et programme"
      url: "https://resistons-france.fr/"
      date: 2025-03-23
  immigration:
    texte: "Renforcer les effectifs des douanes et des forces aux frontières où se concentre l'immigration illégale, tout en respectant le droit d'asile."
    statut: verifie
    anterieur: "Présidentielle 2022"
    source:
      titre: "Site de Résistons !, page d'accueil et programme"
      url: "https://resistons-france.fr/"
      date: 2025-03-23
  energie:
    texte: "Rénover et prolonger de 25 ans les centrales nucléaires en fin de vie, développer le nucléaire de 4e génération et « stopper l'éolien », en interdisant les projets non validés par les maires."
    statut: verifie
    anterieur: "Présidentielle 2022"
    source:
      titre: "Site de Résistons !, page d'accueil et programme"
      url: "https://resistons-france.fr/"
      date: 2025-03-23
  fiscalite:
    texte: "Rétablir l'impôt sur la fortune (ISF) en supprimant l'IFI et baisser la TVA sur les hydrocarbures de 20 % à 5,5 %."
    statut: verifie
    anterieur: "Présidentielle 2022"
    source:
      titre: "Site de Résistons !, page d'accueil et programme"
      url: "https://resistons-france.fr/"
      date: 2025-03-23
  europe:
    texte: "Faire débattre et voter au Parlement toute législation d'origine européenne, revoir la participation financière de la France au budget européen et interrompre la négociation d'accords comme le CETA."
    statut: verifie
    anterieur: "Présidentielle 2022"
    source:
      titre: "Site de Résistons !, page d'accueil et programme"
      url: "https://resistons-france.fr/"
      date: 2025-03-23
  securite:
    texte: "Ouvrir sur de larges horaires 2 000 bureaux de police et de gendarmerie dans les quartiers et les bourgs, et lancer un plan de construction de prisons pour appliquer les peines courtes."
    statut: verifie
    anterieur: "Présidentielle 2022"
    source:
      titre: "Site de Résistons !, page d'accueil et programme"
      url: "https://resistons-france.fr/"
      date: 2025-03-23
analyses: []
# Profil (sources : voir sourcesProfil)
naissance: { date: 1955-05-03, lieu: "Lourdios-Ichère (Pyrénées-Atlantiques)" }
biographie: "Issu d'une famille de bergers de la vallée d'Aspe, technicien agricole, il devient à 21 ans maire de son village natal, puis conseiller général et député UDF puis MoDem. Connu pour sa grève de la faim de 2006 contre le départ d'une usine de sa vallée et pour sa marche à travers la France, il quitte le MoDem en 2016 et fonde Résistons !. Battu aux législatives de 2024, il monte en 2025 sur scène dans un spectacle autobiographique."
fonctions:
  - { intitule: "Président de Résistons !", periode: "depuis 2016" }
  - { intitule: "Président de l'Association des populations des montagnes du monde", periode: "depuis août 2002" }
