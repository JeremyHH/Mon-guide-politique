name: Signaler une erreur
description: Une position inexacte, une source manquante ou un oubli.
title: "[Correction] "
labels: [correction]
body:
  - type: input
    id: fiche
    attributes:
      label: Candidat ou page concernée
      placeholder: "ex. Édouard Philippe, thème Retraites"
    validations:
      required: true
  - type: textarea
    id: probleme
    attributes:
      label: Ce qui est inexact
      description: Recopiez la phrase en cause.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Lien vers le programme, l'interview ou le discours, avec sa date.
    validations:
      required: true
